name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build draft release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: true

      - name: Set up release signing
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEY_STORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing release signing secret: $name" >&2
              exit 1
            fi
          done

          umask 077
          mkdir -p keystore
          printf '%s' "$SIGNING_KEY_STORE_BASE64" | base64 --decode > keystore/intentx.jks
          printf 'storeFile=keystore/intentx.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' \
            "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" "$SIGNING_STORE_PASSWORD" > keystore.properties

      - name: Check formatting, test, and build release APK
        run: ./gradlew spotlessCheck :app:testDebugUnitTest :intent-executor:testDebugUnitTest :app:assembleRelease

      - name: Name release APK from Gradle version
        id: apk
        run: |
          metadata=app/build/outputs/apk/release/output-metadata.json
          version_name=$(jq -er '.elements[0].versionName' "$metadata")
          output_file=$(jq -er '.elements[0].outputFile' "$metadata")
          source_apk="app/build/outputs/apk/release/$output_file"
          target_apk="app/build/outputs/apk/release/IntentX-$version_name.apk"
          test -f "$source_apk"
          mv "$source_apk" "$target_apk"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "apk=$target_apk" >> "$GITHUB_OUTPUT"

      - name: Protect published releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
        run: |
          if is_draft=$(gh release view "$VERSION_NAME" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$is_draft" != true ]; then
              echo "Release $VERSION_NAME is already published" >&2
              exit 1
            fi
          fi

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: IntentX ${{ steps.apk.outputs.version_name }}
          tag_name: ${{ steps.apk.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: false
          files: ${{ steps.apk.outputs.apk }}
